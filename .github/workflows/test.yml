name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - redmine: 5.0.14
            ruby: '3.1'
          - redmine: 5.1.13
            ruby: '3.2'
          - redmine: 6.0.10
            ruby: '3.3'
          - redmine: 6.1.3
            ruby: '3.3'

    name: Redmine ${{ matrix.redmine }} / Ruby ${{ matrix.ruby }}

    steps:
      - name: Check out Redmine
        uses: actions/checkout@v4
        with:
          repository: redmine/redmine
          ref: ${{ matrix.redmine }}
          path: redmine

      - name: Check out plugin
        uses: actions/checkout@v4
        with:
          path: redmine/plugins/redmine_status_history

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}

      - name: Configure Redmine
        working-directory: redmine
        run: |
          cp plugins/redmine_status_history/.github/database.yml config/database.yml
          bundle config set path vendor/bundle
          bundle install --jobs 4 --retry 3

      - name: Prepare test database
        working-directory: redmine
        env:
          RAILS_ENV: test
          REDMINE_LANG: en
        run: |
          bundle exec rake db:migrate
          bundle exec rake redmine:plugins:migrate
          bundle exec rake redmine:load_default_data

      - name: Verify migration cycle
        working-directory: redmine
        env:
          RAILS_ENV: test
        run: |
          bundle exec rake redmine:plugins:migrate NAME=redmine_status_history VERSION=0
          bundle exec rails runner 'raise "Plugin table still exists" if ActiveRecord::Base.connection.table_exists?(:issue_status_histories); raise "Plugin column still exists" if ActiveRecord::Base.connection.column_exists?(:issues, :last_status_update)'
          bundle exec rake redmine:plugins:migrate NAME=redmine_status_history

      - name: Run plugin tests
        working-directory: redmine
        env:
          RAILS_ENV: test
        run: bundle exec rake redmine:plugins:test NAME=redmine_status_history
